[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "ultrasonic-agentics"
version = "2.0.0a1"
requires-python = ">=3.11"
description = "Authenticated inert records and bounded simulated acoustic transport"
dependencies = ["cryptography==50.0.1", "numpy==2.4.3"]
[tool.setuptools.packages.find]
include = ["ultrasonic_v2*"]
